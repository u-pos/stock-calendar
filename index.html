<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>株イベント備忘録カレンダー</title>

<style>
body{
  margin:0;
  font-family:sans-serif;
  background:#f5f5f5;
}

/* ヘッダー */
.header-bar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:10px;
  background:#222;
  color:#fff;
}

.header-bar button{
  padding:6px 12px;
  font-size:16px;
}

/* カレンダー */
.grid{
  display:grid;
  grid-template-columns:repeat(7,1fr);
}

/* 曜日 */
.header{
  background:#eee;
  text-align:center;
  padding:6px 0;
  font-weight:bold;
  border:1px solid #ccc;
}

.sun{ background:#ffdede; }
.sat{ background:#dde5ff; }
.week{ background:#eee; }

/* セル */
.cell{
  border:1px solid #ccc;
  min-height:160px;
  background:#fff;
  padding:4px;
  display:flex;
  flex-direction:column;
}

/* 日付 */
.date{
  font-weight:bold;
  margin-bottom:4px;
}

/* メモ */
.memo{
  flex:1;
  font-size:16px;
  white-space:pre-wrap;
  overflow-wrap:break-word;
  margin-bottom:3px;
}

/* textarea */
textarea{
  width:100%;
  height:70px;
  resize:vertical;
  box-sizing:border-box;
  font-size:16px;
}

/* ボタン */
.actions{
  display:flex;
  gap:4px;
}

.actions button{
  flex:1;
  padding:4px;
  font-size:12px;
}
 
  
  .nikkei{
  font-size:15px;
  font-weight:bold;
  margin-bottom:6px;
}

.up{
  color:green;
}

.down{
  color:red;
}
.memo-wrap{
  margin-top:4px;
  display:flex;
  flex-direction:column;
  gap:4px;
  flex:1;
}

.memo-input{
  width:100%;
  flex:1;
  resize:none;
  font-size:14px;
  line-height:1.4;
  box-sizing:border-box;
  padding:4px;
  color:black;
  background:white;
}

.memo-buttons{
  display:flex;
  gap:4px;
}

.memo-buttons button{
  font-size:12px;
  padding:2px 6px;
}
  .date-row{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.mini-percent{
  font-size:12px;
  font-weight:bold;
}

.memo-input{
  width:100%;
  flex:1;
  resize:none;
  font-size:14px;   /* ←大きく */
  line-height:1.4;
  box-sizing:border-box;
  padding:4px;
}
</style>
</head>

<body>

<div class="header-bar">
  <button onclick="prev()">←</button>
  <div id="title"></div>
  <button onclick="next()">→</button>
</div>

<div id="grid" class="grid"></div>

<script src="script.js"></script>

</body>
</html>
